# Converts newly finished Codeforces problems every 6 hours, saves them to the
# repository and publishes the library on GitHub Pages.
# Setup (once): Settings > Pages > Source: "GitHub Actions", and
#               Settings > Secrets and variables > Actions > New repository secret: GEMINI_API_KEY
name: Update library

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "How many problems to convert in this run"
        required: false
        default: "150"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/requirements.txt

      - name: Install the builder
        run: pip install -r builder/requirements.txt

      - name: Convert new problems
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_FALLBACK: ${{ vars.LLM_FALLBACK }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          CUSTOM_BASE_URL: ${{ vars.CUSTOM_BASE_URL }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
          CUSTOM_MODEL: ${{ vars.CUSTOM_MODEL }}
          CF_COOKIE: ${{ secrets.CF_COOKIE }}
          CF_USER_AGENT: ${{ secrets.CF_USER_AGENT }}
          CF_FETCH_MODE: requests
        run: python builder/build.py update --limit "${{ github.event.inputs.limit || '150' }}"

      - name: Save the new problems to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library builder/state
          if git diff --cached --quiet; then
            echo "Nothing new."
          else
            git commit -m "library: update $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: library
      - id: deploy
        uses: actions/deploy-pages@v4
