# Publishes library/ on GitHub Pages whenever you push changes to it
# (for example after running the builder on your own computer).
name: Publish library

on:
  push:
    branches: [main]
    paths: ["library/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: library
      - id: deploy
        uses: actions/deploy-pages@v4
